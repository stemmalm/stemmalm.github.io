<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lineage · StemmaLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=20261029072941">
<link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
<div class="wrap wide">
  <div class="bar"></div>

  <h1>Lineage</h1>
  <div class="sub">Choose an individual to meet it.</div>

  <div class="fig" style="margin-top:22px">
    <p class="fig-cap">fig. 1 — every individual, by generation</p>
    <div id="tree"></div>
  </div>

  <footer>Data: CHILDES (CC BY-NC-SA 4.0), via AO-CHILDES.</footer>
</div>

<script type="module">
import { header, registry, lineageMap } from "./site.js?v=20261029072941";
header("lineage");
const [reg, stats] = await Promise.all([registry(), fetch("stats.json?v=" + Date.now()).then((r) => r.json())]);
const map = lineageMap(reg, stats);
map.style.setProperty("--map-h", "520px");
document.getElementById("tree").append(map);
</script>
</body>
</html>
