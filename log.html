<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log · StemmaLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=202610281845">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  .entry { margin-top: 34px; }
  .entry .date { font-family: var(--font-id); font-size: 13px; color: var(--muted); }
  .entry h2 { margin: 2px 0 10px; }
  .entry table { border-collapse: collapse; width: 100%; font-size: 15.5px; margin: 6px 0 18px; }
  .entry caption { text-align: left; font-style: italic; color: var(--muted); padding-bottom: 4px; }
  .entry th, .entry td { padding: 3px 8px; text-align: left; }
  .entry thead th { font-weight: 500; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .entry tbody tr:last-child td { border-bottom: 1.5px solid var(--ink); }
  .entry + .entry { border-top: 1px solid var(--faint); padding-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"></div>

  <h1>Log</h1>
  <div class="sub">What happened along the way, newest first.</div>

  <div id="entries"></div>

  <footer>Data: CHILDES (CC BY-NC-SA 4.0), via AO-CHILDES. Findings here are exploratory.</footer>
</div>

<script type="module">
import { el, header } from "./site.js?v=202610281845";
header("log");

const entries = await fetch("log.json").then((r) => r.json());
const box = document.getElementById("entries");
const fmt = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
for (const e of [...entries].reverse()) {
  const art = el("article", { class: "entry" }, el("div", { class: "date", text: fmt(e.date) }), el("h2", { text: e.title }));
  for (const p of e.body) art.append(el("p", { text: p }));
  for (const tb of e.tables || (e.table ? [e.table] : [])) {
    const t = el("table", {}, el("caption", { text: tb.caption }));
    t.append(el("thead", {}, el("tr", {}, ...tb.head.map((h) => el("th", { text: h })))));
    t.append(el("tbody", {}, ...tb.rows.map((r) => el("tr", {}, ...r.map((c) => el("td", { text: c }))))));
    art.append(t);
  }
  box.append(art);
}
</script>
</body>
</html>
