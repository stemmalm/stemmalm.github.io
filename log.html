<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log · StemmaLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=20261029131443">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  .log-list { margin-top: 26px; border-top: 1px solid var(--rule); }
  .log-item { border-bottom: 1px solid var(--faint); }
  .log-item > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 7.6rem minmax(0, 1fr) 1rem; gap: 12px; align-items: baseline; padding: 10px 2px; }
  .log-item > summary::-webkit-details-marker { display: none; }
  .log-item > summary:hover { background: var(--mark); }
  .log-item > summary:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
  .log-id { font-family: var(--font-id); font-size: 13px; color: var(--muted); }
  .log-title { font-weight: 500; }
  .log-caret { font-family: var(--font-id); color: var(--muted); transition: transform 0.15s; }
  .log-item[open] .log-caret { transform: rotate(90deg); }
  .log-body { padding: 4px 2px 18px 0; }
  .log-body > p, .log-body > ul, .log-body > ol, .log-body > .log-correction { max-width: 74ch; }
  @media (min-width: 560px) { .log-body { padding-left: calc(7.6rem + 12px); } }
  .log-body table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 6px 0 16px; }
  .log-body caption { text-align: left; color: var(--muted); font-size: 13.5px; padding-bottom: 4px; }
  .log-body th, .log-body td { padding: 3px 8px 3px 0; text-align: left; }
  .log-body thead th { font-family: var(--font-id); font-size: 13px; font-weight: 500; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .log-body tbody tr:last-child td { border-bottom: 1.5px solid var(--ink); }
  .log-correction { border-left: 2px solid var(--rule); padding-left: 10px; color: var(--muted); font-size: 14.5px; }
  .log-body .permalink { font-family: var(--font-id); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap wide">
  <div class="bar"></div>

  <h1>Log</h1>
  <div class="sub">A lab notebook: each entry numbered by date and order of the day, newest first.</div>

  <div class="log-list" id="entries"></div>

  <footer>Data: CHILDES (CC BY-NC-SA 4.0), via AO-CHILDES. Findings here are exploratory.</footer>
</div>

<script type="module">
import { el, header } from "./site.js?v=20261029131443";
header("log");

const entries = await fetch("log.json?v=" + Date.now()).then((r) => r.json());
const box = document.getElementById("entries");
for (const e of [...entries].sort((a, b) => b.id.localeCompare(a.id))) {
  const item = el("details", { class: "log-item", id: e.id },
    el("summary", {}, el("span", { class: "log-id", text: e.id }), el("span", { class: "log-title", text: e.title }), el("span", { class: "log-caret", text: "›", "aria-hidden": "true" })));
  const body = el("div", { class: "log-body" });
  if (e.correction) body.append(el("p", { class: "log-correction", text: e.correction }));
  for (const p of e.body) body.append(el("p", { text: p }));
  for (const tb of e.tables || (e.table ? [e.table] : [])) {
    const t = el("table", {}, el("caption", { text: tb.caption }));
    t.append(el("thead", {}, el("tr", {}, ...tb.head.map((h) => el("th", { text: h })))));
    t.append(el("tbody", {}, ...tb.rows.map((r) => el("tr", {}, ...r.map((c) => el("td", { text: c }))))));
    body.append(t);
  }
  body.append(el("a", { class: "permalink", href: "#" + e.id, text: "link to " + e.id }));
  item.append(body);
  box.append(item);
}
// open the entry a link points to, on load and when the link changes
function openFromHash() {
  const target = location.hash && document.getElementById(location.hash.slice(1));
  if (target) { target.open = true; target.scrollIntoView(); }
}
openFromHash();
addEventListener("hashchange", openFromHash);
</script>
</body>
</html>
