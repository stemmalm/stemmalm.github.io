<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StemmaLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=20261029132453">
<link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
<div class="wrap wide">
  <div class="bar"></div>

  <a href="./" class="muted" style="font-size:15px">← Collection</a>
  <h1 id="title" style="margin-top:6px">#</h1>
  <div class="sub id" id="full"></div>

  <div class="cols ind-top">
    <div><h2>Name</h2><dl class="anat" id="anat"></dl></div>
    <div><h2>Life</h2><dl class="anat" id="life"></dl></div>
  </div>

  <div class="cols ind-talk">

  <section id="talk-sec" hidden>
    <h2>Talk</h2>
    <div class="age">
      <label for="age" class="muted" style="font-size:14px">Age in months</label>
      <input type="range" id="age" min="0" max="72" step="1" value="30">
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <div class="phases" id="phases" aria-hidden="true"></div>
    </div>
    <div class="chat">
      <div class="chat-head"><span class="chat-avatar" aria-hidden="true"></span><span class="chat-name" id="chat-name"></span><span class="chat-sub" id="chat-sub"></span></div>
      <div class="chat-log" id="log" aria-live="polite"></div>
      <form id="compose" class="chat-compose" autocomplete="off">
        <input id="say" type="text" placeholder="Message" aria-label="What you say">
        <button type="submit" id="send" aria-label="Send">↑</button>
      </form>
    </div>
  </section>
  <section id="cmp-sec" hidden>
    <h2>Same line, two ages</h2>
    <div class="cmp-ages">
      <label>age <select id="age-a"></select></label>
      <label>against <select id="age-b"></select></label>
    </div>
    <form id="cmp-form" class="chat-compose cmp-compose" autocomplete="off">
      <input id="cmp-say" type="text" placeholder="say one line to both" aria-label="What you say to both ages">
      <button type="submit" id="cmp-send" aria-label="Send to both">↑</button>
    </form>
    <div id="cmp-log" class="cmp-log" aria-live="polite"></div>
  </section>
  </div>
  <p class="muted" id="not-yet" hidden style="margin-top:28px;font-family:var(--font-id);font-size:14px">// not grown yet — you can talk to it once it is grown</p>

  <footer>Data: CHILDES (CC BY-NC-SA 4.0), via AO-CHILDES. The model runs in your browser; names in its replies are replaced by “(name)”.</footer>
</div>

<script type="module">
import { registry, fullId, STATUS, el, header } from "./site.js?v=20261029132453";
header("");
import { decode, makeModel, reply, scrub } from "./stemma.js?v=20261029132453";

// weights: the public model repo on Hugging Face; a local folder when previewing on this machine
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !new URLSearchParams(location.search).has("hf");  // ?hf: use the public weights while previewing
const BASE = LOCAL ? "weights/" : "https://huggingface.co/xchuanli/stemmalm-weights/resolve/main/";

const reg = await registry();
const serial = Number(new URLSearchParams(location.search).get("n")) || 1;
const ind = reg.individuals.find((i) => i.serial === serial) || reg.individuals[0];
const pad = (n) => String(n).padStart(3, "0");

document.title = `#${ind.serial} · StemmaLM`;
document.getElementById("title").textContent = "#" + ind.serial;
document.getElementById("full").textContent = fullId(ind);

// how the full name reads, part by part
const anat = document.getElementById("anat");
const when = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { timeZone: "Europe/Berlin", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " CET" : "—";
const rows = [
  ["Strain", `${ind.strain} — ${reg.strains[ind.strain]}`],
  ["Upbringing", `${ind.env} — ${reg.envs[ind.env]}`],
  ["Generation", ind.gen === 0 ? "G0 — taught by real caregivers" : `G${ind.gen} — taught by its parent's copy`],
  ["Lesion", ind.lesion || "none"],
  ["Seed", `s${ind.seed}`],
];
for (const [k, v] of rows) anat.append(el("dt", { text: k }), el("dd", { text: v }));

// its life so far: facts from the registry
const life = document.getElementById("life");
const lifeRows = [
  ["Born", when(ind.born)],
  ["Grown", when(ind.grown)],
  ["Heard", ind.heard ? `${ind.heard} — ${reg.corpora?.[ind.heard] || ""}` : "—"],
  ["Parent", ind.parent ? `#${ind.parent}` : "none (real caregivers)"],
  ...(ind.clone_of ? [["Clone of", `#${ind.clone_of} at ${ind.clone_at} months: the same life up to then, a different one after`]] : []),
];
for (const x of ind.extended || [])
  lifeRows.push(["Extended", `${x.months[0]}–${x.months[1]} months on ${x.env}${x.env === "WT2" ? " (children's books only)" : x.env === "WT2m" ? " (70% children's books, 30% family speech)" : ""}. On held-out family speech (Ω), bits per character went from ${x.omega_bpc[0].toFixed(2)} at 72 months to ${x.omega_bpc[1].toFixed(2)} at ${x.months[1]}.`]);
for (const [k, v] of lifeRows) life.append(el("dt", { text: k }), el("dd", { text: v }));
const pa = life.querySelectorAll("dd")[3];
if (ind.parent) { pa.textContent = ""; pa.append(el("a", { href: `individual.html?n=${ind.parent}`, text: `#${ind.parent}` })); }

if (ind.status !== "trained") {
  document.getElementById("not-yet").hidden = false;
} else {
  document.getElementById("talk-sec").hidden = false;
  const state = { age: 30, logs: {} };
  // the slider covers the whole life; each stretch of it is coloured by what the individual heard then
  const MAX = Math.max(72, ...(ind.extended || []).map((x) => x.months[1]));
  const slider = document.getElementById("age");
  slider.max = MAX;
  const phases = [{ from: 0, to: 72, env: ind.heard || "Ω", cls: "p0" }, ...(ind.extended || []).map((x, k) => ({ from: x.months[0] - 1, to: x.months[1], env: x.env, cls: x.env === "WT2m" ? "p2" : "p" + (k + 1) }))];
  const pct = (m) => (100 * m / MAX).toFixed(2) + "%";
  slider.style.background = "linear-gradient(to right, " + phases.map((p) => `var(--${p.cls}) ${pct(p.from)} ${pct(p.to)}`).join(", ") + ")";
  const ticks = document.getElementById("ticks");
  for (let m = 0; m <= MAX; m += MAX > 72 ? 24 : 12) ticks.append(el("span", { text: String(m) }));
  if (phases.length > 1) {
    const ph = document.getElementById("phases");
    for (const p of phases) ph.append(el("span", { class: p.cls, style: `width:${pct(p.to - p.from)}`, text: p.env === "WT2" ? "WT2 · books only" : p.env === "WT2m" ? "WT2m · books + family speech" : p.env + " · family speech" }));
  }
  let man = null;
  const models = new Map();

  // a clone's life before the branch point is the original's; its snapshots are read from there
  const manifests = {};
  const getMan = (n) => manifests[n] || (manifests[n] = fetch(`${BASE}n${pad(n)}/web/manifest.json`).then((r) => { if (!r.ok) throw 0; return r.json(); }));
  async function modelAt(age) {
    const src = ind.clone_of && age < ind.clone_at ? ind.clone_of : serial;
    man = await getMan(src);
    const month = Math.max(...man.snapshots.filter((s) => s <= age));
    const key = src + "@" + month;
    if (!models.has(key)) {
      // snapshots up to 72 months are named m06 ... m72, later ones m073 ... m144
      const buf = await fetch(`${BASE}n${pad(src)}/web/m${String(month).padStart(month > 72 ? 3 : 2, "0")}.bin`).then((r) => { if (!r.ok) throw 0; return r.arrayBuffer(); });
      models.set(key, makeModel(man, decode(buf)));
      if (models.size > 3) models.delete(models.keys().next().value);
    }
    return models.get(key);
  }

  function render(typing = false) {
    document.getElementById("chat-name").textContent = `#${serial}`;
    document.getElementById("chat-sub").textContent = `${state.age} months`;
    const log = document.getElementById("log");
    log.innerHTML = "";
    const msgs = state.logs[state.age] || [];
    if (!msgs.length && !typing) log.append(el("p", { class: "chat-empty", text: `Say something to #${serial} at ${state.age} months.` }));
    msgs.forEach((m, k) => {
      const mine = m.role === "adult", next = msgs[k + 1];
      const tail = !next || next.role !== m.role;  // the last bubble of a run gets the tail
      log.append(el("div", { class: "bubble " + (mine ? "me" : "it") + (tail ? " tail" : "") , text: m.text || "…" }));
    });
    if (typing) log.append(el("div", { class: "bubble it tail typing", "aria-label": "typing" }, el("span"), el("span"), el("span")));
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById("age").addEventListener("input", (e) => { state.age = Number(e.target.value); render(); });
  document.getElementById("compose").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("say"), text = input.value.trim();
    if (!text) return;
    const age = state.age, msgs = state.logs[age] = state.logs[age] || [];
    msgs.push({ role: "adult", text }); input.value = ""; render(true);
    const send = document.getElementById("send");
    send.disabled = true;
    if (!models.size) document.getElementById("chat-sub").textContent = "loading (about 21 MB)…";
    try {
      const model = await modelAt(age);
      await new Promise((r) => setTimeout(r, 20));
      // the conversation so far, one turn per line, as the individual has always heard speech
      const convo = msgs.map((m) => m.text.replace(/\s+/g, " ").slice(0, 200)).join("\n") + "\n";
      msgs.push({ role: "model", text: scrub(reply(model, convo)) });
    } catch {
      msgs.push({ role: "model", text: "(no answer)" });
    }
    send.disabled = false; render(); input.focus();
  });
  render();

  // the same line to two ages, answers side by side
  const ages = (man0) => man0.snapshots;
  const sa = document.getElementById("age-a"), sb = document.getElementById("age-b");
  const own = await getMan(serial).catch(() => null);
  const before = ind.clone_of ? await getMan(ind.clone_of).catch(() => null) : null;
  man = own && { ...own, snapshots: [...new Set([...(before ? before.snapshots.filter((s) => s < ind.clone_at) : []), ...own.snapshots])].sort((a, b) => a - b) };
  if (man) {
    document.getElementById("cmp-sec").hidden = false;
    for (const s of [sa, sb]) for (const m of ages(man)) s.append(el("option", { value: m, text: m + " months" }));
    sa.value = 72; sb.value = String(Math.max(...ages(man)));
    if (sb.value === "72") sa.value = "36";
    document.getElementById("cmp-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("cmp-say"), text = input.value.trim();
      if (!text) return;
      input.value = "";
      const a = Number(sa.value), b = Number(sb.value);
      const cell = (age) => el("div", { class: "cmp-cell" }, el("div", { class: "ex-meta", text: `#${serial} @${age}m` }), el("div", { class: "cmp-reply", text: "…" }));
      const ca = cell(a), cb = cell(b);
      const item = el("div", { class: "cmp-item" }, el("div", { class: "cmp-adult" }, el("span", { class: "muted", text: "you  " }), el("span", { text })), el("div", { class: "cmp-pair" }, ca, cb));
      const logEl = document.getElementById("cmp-log");
      logEl.prepend(item);
      document.getElementById("cmp-send").disabled = true;
      for (const [age, c] of [[a, ca], [b, cb]]) {
        try {
          const model = await modelAt(age);
          await new Promise((r) => setTimeout(r, 20));
          c.querySelector(".cmp-reply").textContent = scrub(reply(model, text.replace(/\s+/g, " ").slice(0, 200) + "\n")) || "…";
        } catch { c.querySelector(".cmp-reply").textContent = "(no answer)"; }
      }
      document.getElementById("cmp-send").disabled = false;
    });
  }
}
</script>
</body>
</html>
